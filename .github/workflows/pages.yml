name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/examples _site/dist
          cp -r examples/. _site/examples/
          cp -r dist/. _site/dist/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Zikra Slider Pro — demo</title>
          <meta http-equiv="refresh" content="0; url=./examples/">
          <link rel="canonical" href="./examples/">
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070912;color:#e5e7eb;font:16px/1.5 system-ui,sans-serif}a{color:#a5b4fc}</style>
          </head>
          <body><p>Opening the demo… <a href="./examples/">Continue to the Zikra Slider Pro demo</a></p></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
